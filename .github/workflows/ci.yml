name: ci

# Fast PR gate for the wrapper: the entrypoint shell logic and the Dockerfile.
# The publish workflow (build-docker.yml) calls this via workflow_call so no
# image is released without green checks. No `push` trigger — pushes to main
# arrive via merged PRs, which already ran here.
on:
  pull_request:
  workflow_call:

# Least privilege: only read the repo. The publishing job in build-docker.yml
# grants its own write scopes on its own job, never through this file.
permissions:
  contents: read

jobs:
  lint:
    # Static gates: ShellCheck on the entrypoint, Hadolint on the Dockerfile,
    # actionlint on the workflows. No image build, so this is fast feedback.
    # Hadolint runs as a SHA-pinned action (ghcr-based, Dependabot-tracked).
    # actionlint runs as a pinned release binary instead: the reviewdog action
    # bundles an outdated actionlint that rejects valid reusable-workflow syntax
    # (workflow_call / job-level `uses:`), so it can't lint our own workflows.
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.7
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: ShellCheck (entrypoint)
        # shellcheck is preinstalled on ubuntu-latest runners.
        run: shellcheck scripts/entrypoint.sh

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: actionlint (workflows)
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  smoke:
    # Build the image from source (pinned electrs release) and boot it the way
    # an Unraid user would (PUID/PGID 99:100), proving the wrapper contract:
    # the Dockerfile compiles end-to-end and the entrypoint validates PUID/PGID,
    # chowns /data, and drops privileges via gosu before exec'ing electrs.
    # The compile is the expensive part, so the layers are cached via the GHA
    # cache: an unrelated PR (entrypoint/docs only) reuses the cached build and
    # finishes in seconds; a Dockerfile change forces a real recompile — which
    # is exactly when we want one. A full runtime smoke would need a bitcoind
    # backend, so the boot test uses `electrs --version`: enough to prove the
    # binary runs as the dropped user and that /data ends up correctly owned.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve electrs version to build
        id: electrs
        env:
          GH_TOKEN: ${{ github.token }}
          # Fallback for the very first build, before this repo has any release.
          FALLBACK_VERSION: v0.11.1
        run: |
          # Build the last version THIS repo released — i.e. the latest
          # known-good electrs tag. release-check.yml keeps that in sync with
          # upstream daily, so the smoke auto-tracks new releases without a
          # manual bump, and never goes red on a brand-new upstream tag that may
          # not compile yet (only already-released versions are ever built).
          tag=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$tag" ]; then tag="$FALLBACK_VERSION"; fi
          echo "Building electrs $tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: |
            ELECTRS_VERSION=${{ steps.electrs.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: electrs:ci

      - name: Run container (PUID/PGID 99:100)
        run: |
          mkdir -p data
          docker run --rm \
            -e PUID=99 -e PGID=100 \
            -v "$PWD/data:/data" \
            electrs:ci --version

      - name: Assert data dir ownership (gosu drop)
        run: |
          owner=$(stat -c '%u:%g' data)
          echo "data dir owner: $owner"
          [ "$owner" = "99:100" ] || { echo "expected 99:100"; exit 1; }

      - name: Assert PUID/PGID validation rejects non-integers
        run: |
          # The entrypoint must refuse non-numeric PUID/PGID before doing any
          # privileged work — a regression here would silently run as root.
          if docker run --rm -e PUID=abc electrs:ci --version; then
            echo "entrypoint accepted a non-integer PUID"; exit 1
          fi
          echo "non-integer PUID correctly rejected"
