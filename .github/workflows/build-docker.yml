name: Build Electrs Docker Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Electrs Version (e.g. v0.10.6)"
        required: true
      LATEST:
        description: "Set to true to tag this image as latest"
        required: true
        default: "true"

jobs:
  # Gate the release on the same checks PRs run (lint + wrapper smoke). A red
  # ci means no image is published.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: meta
        env:
          VERSION: ${{ github.event.inputs.VERSION }}
          LATEST: ${{ github.event.inputs.LATEST }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION must match vX.Y.Z (got '$VERSION')" >&2
            exit 1
          fi
          SHORT_VERSION="${VERSION#v}"

          {
            echo "VERSION=$VERSION"
            echo "LATEST=$LATEST"
            echo "SHORT_VERSION=$SHORT_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            ELECTRS_VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.SHORT_VERSION }}
            ${{ steps.meta.outputs.LATEST == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-electrs:${{ steps.meta.outputs.SHORT_VERSION }}
            ${{ steps.meta.outputs.LATEST == 'true' && format('docker.io/{0}/docker-electrs:latest', secrets.DOCKERHUB_USERNAME) || '' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "Electrs Docker ${{ steps.meta.outputs.VERSION }}"
          body: |
            This Docker image is built from the official electrs source for version **${{ steps.meta.outputs.VERSION }}**.

            **Official Electrs Release Notes**
            https://github.com/romanz/electrs/blob/master/RELEASE-NOTES.md

            ---
            Built automatically from upstream electrs releases.
