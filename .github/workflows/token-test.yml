name: Token Dispatch Test (temporary)

# Temporary workflow to verify that the built-in GITHUB_TOKEN with
# `actions: write` can trigger workflow_dispatch events.
# Trigger it once from the Actions UI, then delete this file.

on:
  workflow_dispatch:

jobs:
  test_dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Dispatch release-check.yml via GITHUB_TOKEN
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-check.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatch accepted - GITHUB_TOKEN can trigger workflows."
