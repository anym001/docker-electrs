name: Check Electrs Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check_releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new release and trigger build
        run: |
          AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"

          OFFICIAL_VERSION=$(curl -s \
            -H "$AUTH_HEADER" \
            "https://api.github.com/repos/romanz/electrs/releases/latest" \
            | jq -r 'if .tag_name then .tag_name | ltrimstr("v") else empty end')

          if [ -z "$OFFICIAL_VERSION" ]; then
            echo "Failed to fetch latest official release."
            exit 1
          fi

          CURRENT_VERSION=$(curl -s \
            -H "$AUTH_HEADER" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r 'if .tag_name then .tag_name | ltrimstr("v") else empty end')

          if [ "$OFFICIAL_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Already up to date at v$OFFICIAL_VERSION."
            exit 0
          fi

          echo "New version detected: v$OFFICIAL_VERSION (current: ${CURRENT_VERSION:-none})"
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GHCR_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-docker.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"VERSION\":\"v$OFFICIAL_VERSION\",\"LATEST\":\"true\"}}"
