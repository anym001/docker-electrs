name: Check Electrs Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check_releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for missing releases and trigger builds
        run: |
          AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"

          # Get last 10 official electrs releases (strips leading 'v')
          OFFICIAL=$(curl -s \
            -H "$AUTH_HEADER" \
            "https://api.github.com/repos/romanz/electrs/releases?per_page=10" \
            | jq -r 'if type == "array" then .[].tag_name | ltrimstr("v") else empty end')

          if [ -z "$OFFICIAL" ]; then
            echo "Failed to fetch official releases or none found."
            exit 1
          fi

          # Get all our existing releases (empty string if repo has no releases yet)
          OUR=$(curl -s \
            -H "$AUTH_HEADER" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r 'if type == "array" then .[].tag_name | ltrimstr("v") else empty end')

          LATEST_OFFICIAL=$(echo "$OFFICIAL" | head -1)

          for VERSION in $OFFICIAL; do
            if ! echo "$OUR" | grep -qx "$VERSION"; then
              [ "$VERSION" = "$LATEST_OFFICIAL" ] && LATEST_FLAG=true || LATEST_FLAG=false
              echo "Triggering build for v$VERSION (LATEST=$LATEST_FLAG)"
              curl -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token ${{ secrets.GHCR_PAT }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-docker.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"VERSION\":\"v$VERSION\",\"LATEST\":\"$LATEST_FLAG\"}}"
            fi
          done

          echo "Done."
